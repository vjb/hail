# Render Blueprint for Hail: web service + Postgres. The sweeper cron job is parked while on free plans.
# Secrets are declared with `sync: false`: Render asks for them when the Blueprint is first applied.
# Plans: FREE for now (D-017). Free limits:
#   - no pre-deploy command, so migrations and the idempotent seed run in startCommand;
#   - no cron jobs, so the sweeper runs from .github/workflows/sweep.yml every 5 minutes;
#   - the free database expires 30 days after creation, and the web service sleeps after 15 idle minutes.
# Before judging (the demo must stay up through Dec 15, 2026): web plan 0.5c-512mb, database plan 0.5c-1g,
# migrate+seed back in preDeployCommand, restore the cron job below and delete the GitHub workflow.

services:
  - type: web
    name: hail
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: hail-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: AI_PROVIDER
        value: claude
      - key: AI_MODEL_SCREEN
        value: claude-haiku-5-5
      - key: AI_MODEL_VERIFY
        value: claude-sonnet-5-5
      - key: AI_MODEL_OPS
        value: claude-sonnet-5-5
      - key: DEMO_TIME_SCALE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: SWEEP_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: DEMO_OWNER_EMAIL
        sync: false
      - key: DEMO_OWNER_PASSWORD
        sync: false
      - key: DEMO_WORKER1_EMAIL
        sync: false
      - key: DEMO_WORKER1_PASSWORD
        sync: false
      - key: DEMO_WORKER1_PAYPAL_EMAIL
        sync: false
      - key: DEMO_WORKER2_EMAIL
        sync: false
      - key: DEMO_WORKER2_PASSWORD
        sync: false
      - key: DEMO_WORKER2_PAYPAL_EMAIL
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false

  # - type: cron
  #   name: hail-sweeper
  #   runtime: node
  #   plan: 0.5c-512mb
  #   region: oregon
  #   schedule: "* * * * *"
  #   buildCommand: "true"
  #   startCommand: node scripts/sweep-ping.mjs
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "24"
  #     - key: APP_BASE_URL
  #       sync: false
  #     - key: SWEEP_SECRET
  #       sync: false

databases:
  - name: hail-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: hail
    user: hail
